services:
  db:
    image: postgres:16-alpine
    container_name: foodstore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodstore
      POSTGRES_PASSWORD: foodstore
      POSTGRES_DB: foodstore_db
    ports:
      - "5432:5432"
    volumes:
      - foodstore_pgdata:/var/lib/postgresql/data
    healthcheck:
      # el backend necesita que la base acepte conexiones, no solo que el
      # contenedor este levantado
      test: ["CMD-SHELL", "pg_isready -U foodstore -d foodstore_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foodstore_pgdata:
